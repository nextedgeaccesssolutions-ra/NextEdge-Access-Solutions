name: neas-web-preview

services:
  neas-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: neas-web:preview
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEAS_WEB_PORT:-3010}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to an approved non-production database for local preview}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
