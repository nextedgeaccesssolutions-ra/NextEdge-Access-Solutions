version: 2
updates:
  # Dependabot uses the npm ecosystem adapter for pnpm-lock.yaml.
  # Group security fixes separately for production and development dependencies.
  # Include every SemVer level so major security fixes are not left ungrouped.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      production-security-fixes:
        applies-to: security-updates
        dependency-type: production
        update-types:
          - "patch"
          - "minor"
          - "major"
      development-security-fixes:
        applies-to: security-updates
        dependency-type: development
        update-types:
          - "patch"
          - "minor"
          - "major"
