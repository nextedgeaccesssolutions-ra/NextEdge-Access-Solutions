version: 2
updates:
  # Dependabot uses the npm ecosystem adapter for pnpm-lock.yaml.
  # Keep security updates enabled, but do not group unrelated dependencies:
  # separate updates let Dependabot isolate compatibility conflicts.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      production-security-patches:
        applies-to: security-updates
        dependency-type: production
        update-types:
          - "patch"
          - "minor"
      development-security-patches:
        applies-to: security-updates
        dependency-type: development
        update-types:
          - "patch"
          - "minor"
    # Do not ignore major security updates; they must remain visible as PRs
    # for a deliberate compatibility review, rather than being suppressed.
