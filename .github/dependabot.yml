version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Manila"
    groups:
      neas-minor-patch:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "automation"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "node"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Manila"
    groups:
      actions-minor-patch:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "automation"]
    commit-message:
      prefix: "chore(actions)"
