name: NEAS Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neas-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Next.js build (no database migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify package.json/package-lock.json synchronization
        run: npm run test:lockfile
        working-directory: web

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Test bounded Gmail recipient validation
        run: npm run test:aiw-email-validation
        working-directory: web

      - name: Test Gmail provider error explanations
        run: node --experimental-strip-types --test scripts/test-aiw-gmail-errors.mjs
        working-directory: web

      - name: Test Gmail opt-out enforcement
        run: npm run test:aiw-contact-policy
        working-directory: web

      - name: Test AI Workforce authority enforcement
        run: npm run test:aiw-authority
        working-directory: web

      - name: Test AI Gateway OIDC budget enforcement
        run: npm run test:ai-gateway
        working-directory: web

      - name: Test AI Workforce Gateway readiness reporting
        run: npm run test:aiw-readiness
        working-directory: web

      - name: Test AI Workforce specialist skill registry
        run: npm run test:aiw-skills
        working-directory: web

      - name: Test natural-voice TTS provider error mapping
        run: npm run test:voice-tts-errors
        working-directory: web

      - name: Verify clean public route contract
        run: npm run test:clean-routes
        working-directory: web

      - name: Build application without database access (no migrations)
        run: npm run build:app
        working-directory: web
