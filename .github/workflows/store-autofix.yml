name: Store autofix and health watch

# Mechanical auto-fixes (formatting only - never logic) on PRs, plus hard
# verification gates (tests, typecheck, build) and a scheduled production
# probe that files/updates a single rolling issue with evidence.
#
# What this does NOT do: rewrite application logic, touch secrets, deploy,
# or publish policy fields (return/shipping terms stay human-authored).

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: store-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-fix:
    # Kept under its original name so any required-check settings still match.
    # It now REPORTS formatting only and never commits: bot commits pushed to a PR
    # after CI had passed were held as "action required" by GitHub (red runs once
    # the PR merged) and could change files the tests had already checked.
    name: Formatting-only autofix (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Changed files
        id: changed
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, per_page: 100 },
            );
            const names = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter((n) => /\.(ts|tsx|js|jsx|json|css|md)$/.test(n));
            // Written to a file, one per line, so names never pass through shell parsing.
            fs.writeFileSync('changed-files.txt', names.join('\n'));
            core.setOutput('count', String(names.length));

      - name: Prettier check (report only)
        if: steps.changed.outputs.count != '0'
        run: |
          mapfile -t files < changed-files.txt
          if npx --yes prettier@3 --list-different -- "${files[@]}" > unformatted.txt; then
            echo "All changed files are formatted." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Files Prettier would reformat"
              echo "Run \`npx prettier@3 --write <file>\` locally if you want them tidied. This check never blocks or commits."
              echo
              sed 's/^/- `/; s/$/`/' unformatted.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    name: Tests, typecheck, build (blocking gates)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  probe-production:
    name: Store smoke probe (auto-detect, auto-report)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      statuses: read
    env:
      PROD_URL: "https://www.nextedge-access-solutions.com"
      PROBE_PRODUCT: "https://www.nextedge-access-solutions.com/store/p/s474c1ac9f7"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # On a push the new commit is still deploying; probing at once tests the old
      # version and can open a false failure issue. Wait for Vercel to finish (max ~12 min).
      - name: Wait for this commit's production deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 72); do
            STATE=$(gh api "repos/${REPO}/commits/${SHA}/statuses" --jq '[.[]|select(.context=="Vercel")]|sort_by(.created_at)|last|.state // ""' || true)
            echo "Vercel deploy: ${STATE:-not started}"
            case "${STATE}" in success) exit 0 ;; failure|error) echo "Deploy failed; probing the current production anyway."; exit 0 ;; esac
            sleep 10
          done
          echo "Deploy not finished after 12 minutes; probing the current production."

      - name: Probe storefront and structured data
        id: probe
        run: |
          set -u
          FAILS=""
          note() { echo "$1"; FAILS="${FAILS}${1}; "; }

          for path in "/" "/store"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}${path}" || echo "000")
            echo "GET ${path} -> ${CODE}"
            if [ "${CODE}" != "200" ]; then note "FAIL GET ${path} expected=200 got=${CODE}"; fi
          done

          # Probe a product that currently exists: product IDs change when the catalog is reloaded,
          # so take the first product link from /store and fall back to PROBE_PRODUCT.
          FIRST=$(curl -sL "${PROD_URL}/store" | grep -oE '/store/p/[A-Za-z0-9_-]+' | head -1 || true)
          PRODUCT_URL="${PROBE_PRODUCT}"
          if [ -n "${FIRST}" ]; then PRODUCT_URL="${PROD_URL}${FIRST}"; fi
          echo "Probing ${PRODUCT_URL}"
          PCODE=$(curl -sL -o /tmp/product.html -w "%{http_code}" "${PRODUCT_URL}" || echo "000")
          if [ "${PCODE}" != "200" ]; then note "FAIL product page ${PRODUCT_URL} expected=200 got=${PCODE}"; fi
          if grep -q '"seller"' /tmp/product.html; then
            echo "seller markup present"
          else
            note "FAIL product JSON-LD missing seller (PR #239 regression)"
          fi

          if grep -q 'brand.*NEAS' /tmp/product.html; then
            note "INFO product still asserts Brand=NEAS (see PR #239 follow-up)"
          fi

          RCODE=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}/admin/ai-workforce" || echo "000")
          echo "/admin/ai-workforce -> ${RCODE}"
          if [ "${RCODE}" != "301" ] && [ "${RCODE}" != "302" ] && [ "${RCODE}" != "307" ] && [ "${RCODE}" != "308" ]; then
            note "INFO /admin/ai-workforce expected=redirect got=${RCODE} (ok until PR #240 merges)"
          fi

          echo "summary=${FAILS:-all-green}" >> "$GITHUB_OUTPUT"
          if echo "${FAILS}" | grep -q "FAIL"; then
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: File or update rolling watch issue
        if: steps.probe.outputs.verdict == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          TITLE="[auto-watch] Store production probe failures"
          BODY="Automated store probe failed at $(date -u +%FT%TZ). Evidence: ${SUMMARY}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Check Rich Results Test before touching markup."
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number' || true)
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create --title "${TITLE}" --body "${BODY}" --label "automation"
          fi
