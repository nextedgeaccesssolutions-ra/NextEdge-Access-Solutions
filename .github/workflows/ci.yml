name: NEAS CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types and builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Type check
        run: pnpm check

      - name: Build Vite/Express application
        run: pnpm build

      # Deliberately use build:app. The web/package.json "build" script runs
      # database migrations; CI must never mutate a database.
      - name: Install Next.js application dependencies
        run: npm ci
        working-directory: web

      - name: Build Next.js application without migrations
        run: npm run build:app
        working-directory: web
