name: NEAS Dependency Security

on:
  schedule:
    - cron: "30 20 * * 0" # Monday 04:30 Asia/Manila
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dependency-security.yml"

permissions:
  contents: read

concurrency:
  group: neas-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit and dependency validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Validate lockfile consistency
        run: pnpm install --lockfile-only --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test -- --reporter=dot
      - name: Build
        run: pnpm build

  update:
    name: Create reviewed pnpm update PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - name: Update compatible dependencies
        run: |
          pnpm update --latest --no-save=false
      - name: Create pull request when lockfile changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/pnpm-dependency-updates
          delete-branch: true
          commit-message: "chore(deps): update pnpm dependencies"
          title: "chore(deps): automated pnpm dependency updates"
          body: |
            Automated dependency refresh using the repository's pnpm lockfile.

            This pull request is for review only. CI must pass before merge.
            No production deployment is triggered by this workflow.
          add-paths: |
            package.json
            pnpm-lock.yaml
