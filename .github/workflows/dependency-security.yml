name: NEAS Dependency Security

on:
  schedule:
    - cron: "30 20 * * 0" # Monday 04:30 Asia/Manila
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dependency-security.yml"

permissions:
  contents: read

concurrency:
  group: neas-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit and dependency validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Install pnpm before setup-node's cache resolver looks for the pnpm binary.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test -- --reporter=dot
      - name: Build
        run: pnpm build

  update:
    name: Create controlled pnpm update PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install current locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Update patch and minor versions only
        run: pnpm update --no-save
      - name: Create pull request when lockfile changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/pnpm-dependency-updates
          delete-branch: true
          commit-message: "chore(deps): update compatible pnpm dependencies"
          title: "chore(deps): automated compatible pnpm updates"
          body: |
            Automated pnpm-compatible patch/minor dependency refresh.

            Major-version changes are excluded from this routine update.
            Security audit, type checks, tests and build must pass before merge.
            This PR does not deploy to production.
          add-paths: |
            pnpm-lock.yaml
