name: NEAS Dependency Security

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dependency-security.yml"

permissions:
  contents: read

concurrency:
  group: neas-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm install, audit and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependency tree
        run: pnpm audit --prod --audit-level high
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test -- --reporter=dot
      - name: Build
        run: pnpm build
